# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build an image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(tag)
    
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          $githubToken = "$(githubToken)"
          $repository = "$(githubRepository)"
          $branch = "$(githubBranch)"
          $command = "curl -X POST https://api.github.com/repos/$($repository)/actions/workflows/MyWorkflow.yml/dispatches -H 'Authorization: token $githubToken' -H 'Accept: application/vnd.github.v3+json' -d '{""ref"":""$($branch)""}'"
          Invoke-Expression -Command $command

